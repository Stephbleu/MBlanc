
name: Extraire Monsieur Blanc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le ZIP
        run: |
          mkdir -p temp
          unzip -o monsieur-blanc-v2.zip -d temp
          cp -R temp/monsieur-blanc/. .
          rm -rf temp

      - name: Enregistrer les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extraction automatique Monsieur Blanc" || echo "Aucun changement"
          git push
          
